services:
  - type: web
    name: video-analyzer-backend
    env: python
    buildCommand: export CARGO_HOME=$HOME/.cargo && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
        optional: true
      - key: FLASK_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: video-analyzer-backend
          property: port

